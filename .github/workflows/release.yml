name: Release
on:
  push:
    tags:
      - '*'
    paths-ignore:
      - '.github/**'
jobs:
  github-action:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_KEY }}
    steps:
      - name: Clone Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: find JiberishMedia tests -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
      - name: Test standalone and shared library loading
        run: lua5.1 tests/shared_media.lua
      - name: Validate font licenses and inventory
        run: python3 tests/font_licenses.py
      - name: Package and Release
        uses: BigWigsMods/packager@master
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate packaged font licenses
        run: python3 tests/font_licenses.py --archives .release
      - name: Test packaged media loading
        run: |
          for archive in .release/*.zip; do
            package_check_dir="$(mktemp -d)"
            unzip -q "$archive" -d "$package_check_dir"
            lua5.1 tests/shared_media.lua "$package_check_dir/JiberishMedia"
          done
